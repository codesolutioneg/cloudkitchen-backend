name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cloudkitchen
          POSTGRES_PASSWORD: cloudkitchen
          POSTGRES_DB: cloudkitchen
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U cloudkitchen -d cloudkitchen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cloudkitchen:cloudkitchen@localhost:5435/cloudkitchen
      # The suite shares one database, so it runs serially. See vitest.config.ts.
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
